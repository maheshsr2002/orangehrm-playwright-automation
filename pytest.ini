[pytest]
minversion = 7.0
addopts = -v -s --html=reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Quick sanity and smoke tests
    regression: Full regression test suite
    negative: Negative validation scenarios
    positive: Happy path scenarios
    login: Authentication test cases
    logout: Session termination tests
    admin: System User Management tests
    pim: Employee Management and PIM tests
    leave: Leave Management tests
    time: Time tracking, timesheets and attendance tests
    recruitment: Recruitment pipeline tests
    buzz: Buzz social feed tests
    dashboard: Dashboard widget and analytics tests
    profile: My Info / Profile tests
    e2e: Complete end-to-end integration workflows
    master_flow: Unified end-to-end master workflow
    defects: Known defects, edge-cases, and bug reproduction tests
